<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>真机环境与交互采集</title><style>
*{box-sizing:border-box}body{max-width:780px;margin:auto;padding:20px 20px calc(100px + env(safe-area-inset-bottom));font:16px/1.6 system-ui;color:#172033;background:#f5f7fb}section{background:white;border:1px solid #cbd5e1;border-radius:12px;padding:16px;margin:16px 0}label{display:block;margin:12px 0}input,select,button,textarea{font:inherit;padding:10px;max-width:100%;min-height:44px}input,textarea{width:100%}input[type=checkbox]{width:auto}button{margin:6px 8px 6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:300px;overflow:auto}.drag{min-height:120px;background:#cce6ff;border:2px solid #1d4ed8;touch-action:none;padding:24px}.footer{position:fixed;bottom:0;left:0;right:0;background:#162a52;color:white;padding:12px env(safe-area-inset-right) calc(12px + env(safe-area-inset-bottom)) env(safe-area-inset-left);text-align:center}.insets{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.measure{position:fixed;visibility:hidden;pointer-events:none;height:100dvh;width:1px}.warn{color:#8a4100}
</style></head><body data-page="probe"><h1>真机环境采集</h1><p><a href="/">返回验收入口</a></p><p class="warn">只采集环境、视口与事件统计，不采集输入文本或文件内容。导出结果仍为 pending；物理设备、版本及完整案例需人工核验。</p><p id="state">正在绑定验收产物…</p>
<section><h2>目标与设备记录</h2><label>目标<select id="target"></select></label><label>实际 OS 版本（不要从 UA 猜测）<input id="os" placeholder="在设备设置中核对"></label><label>设备型号<input id="device"></label><label>浏览器完整版本<input id="browser"></label><label>宿主 App 版本（微信/App 必填）<input id="host"></label><label>实际内核名称和版本<input id="engine"></label><label><input type="checkbox" id="physical">本人确认当前为物理手机/平板，而非模拟器或桌面 UA 模拟</label></section>
<section><h2>中文输入、自动填充与键盘</h2><label>组合输入测试<input id="ime" autocomplete="off" placeholder="输入测试文字；导出只保留字符数量"></label><label>验证码提示<input id="otp" inputmode="numeric" autocomplete="one-time-code" aria-label="验证码测试"></label><label>多行输入<textarea id="text" rows="3"></textarea></label><p>打开/关闭键盘，横竖屏切换并折叠地址栏，核对底部按钮和当前输入是否可见。</p></section>
<section><h2>真实触摸与长按</h2><div class="drag" id="gesture" tabindex="0" role="region" aria-label="手势测试区域">在此按下、拖拽、取消或长按。页面中的真实组件仍需按首页清单操作。</div><p id="events">尚未记录事件</p></section>
<section><h2>系统文件与相机入口</h2><label>普通测试文件<input id="file" type="file" accept="image/*,video/*"></label><label>相机测试<input id="camera" type="file" accept="image/*" capture="environment"></label><button id="clear-files" type="button">清除测试文件</button><p>仅记录文件类型和大小；不会上传或导出文件内容。微信/App 的系统授权、拒绝和取消需分别检查。</p></section>
<section><h2>环境与视口</h2><div id="insets" class="insets"></div><div id="dvh" class="measure"></div><button id="collect" type="button">重新采集环境</button><button id="download" type="button">导出 JSON</button><button id="copy" type="button">复制 JSON</button><pre id="output"></pre></section><div class="footer">键盘 / 安全区可见性检查：确认按钮应保持可见</div><script src="probe.js" defer></script></body></html>
