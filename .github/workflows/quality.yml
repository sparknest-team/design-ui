name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number to validate (used for bot-created release PRs)
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: design-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Design + ${{ matrix.library }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: cedar-design-web
            node: '26.13.1'
          - library: maple-design-mobile
            node: '26.13.1'
    defaults:
      run:
        working-directory: design-ui
    steps:
      - uses: actions/checkout@v4
        with:
          path: design-ui
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.pull_request_number && format('refs/pull/{0}/merge', inputs.pull_request_number) || '' }}
      - name: Resolve linked pull requests
        id: linked
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          github-token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          script: |
            const { resolve } = require(`${process.env.GITHUB_WORKSPACE}/design-ui/scripts/resolve-ci-refs.cjs`);
            await resolve({ github, context, core });
      - uses: actions/checkout@v4
        with:
          repository: sparknest-team/cedar-design-web
          path: cedar-design-web
          ref: ${{ fromJSON(steps.linked.outputs.refs)['cedar-design-web'] }}
          token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sparknest-team/maple-design-mobile
          path: maple-design-mobile
          ref: ${{ fromJSON(steps.linked.outputs.refs)['maple-design-mobile'] }}
          token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: |
            design-ui/pnpm-lock.yaml
            cedar-design-web/pnpm-lock.yaml
            maple-design-mobile/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: cedar-design-web
      - run: pnpm install --frozen-lockfile
        working-directory: maple-design-mobile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: ${{ matrix.library }}
      - name: Check changeset coverage
        if: steps.linked.outputs.pr != '' && steps.linked.outputs.release != 'true'
        run: pnpm exec changeset status --since=origin/main
      - run: pnpm quality
        if: matrix.library == 'maple'
      - name: Full consumer quality
        run: pnpm quality
        working-directory: ${{ matrix.library }}
      - name: Verify linked PRs stayed unchanged
        uses: actions/github-script@v7
        env:
          CI_LINKS: ${{ steps.linked.outputs.links }}
        with:
          github-token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          script: |
            const { validate } = require(`${process.env.GITHUB_WORKSPACE}/design-ui/scripts/resolve-ci-refs.cjs`);
            await validate({ github });
      - name: Save linked PR snapshot for checked merges
        uses: actions/upload-artifact@v4
        with:
          name: ci-linked-prs-${{ matrix.library }}
          path: ${{ runner.temp }}/linked-prs.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-ui-${{ matrix.library }}-production-browser
          path: ${{ matrix.library }}/artifacts/docs-components
          if-no-files-found: warn

  quality:
    name: quality
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every consumer matrix job to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
