name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-ui
    steps:
      - uses: actions/checkout@v4
        with:
          path: design-ui
          ref: ${{ github.sha }}
      - name: Require Quality on the exact main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: context.sha, per_page: 100 });
            const check = data.check_runs.filter(run => run.name === 'quality' && run.app?.slug === 'github-actions').sort((a, b) => b.id - a.id)[0];
            if (!check || check.status !== 'completed' || check.conclusion !== 'success') throw new Error('Quality must pass on this exact main commit before publishing');
      - uses: actions/checkout@v4
        with:
          repository: sparknest-team/cedar-design-web
          path: cedar-design-web
          token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sparknest-team/maple-design-mobile
          path: maple-design-mobile
          token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || github.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
