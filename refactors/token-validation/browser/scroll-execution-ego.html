<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared scroll Ego Lite execution</title>
<style>body{margin:20px;font:14px system-ui}button{margin:4px;padding:8px}#buttons{display:flex;gap:12px}section{border:1px solid #aaa;padding:8px}#targets iframe{width:340px;height:180px}.scroller{width:240px;height:120px;overflow:auto;scroll-behavior:auto}.content{width:800px;height:800px;background:linear-gradient(#fdb,#acf)}output{display:block;white-space:pre-wrap;max-height:230px;overflow:auto}</style>
<h1>共享滚动 Ego Lite 执行验收</h1><p>两端默认300ms／0ms／真实同源iframe元素与Window。原生入口点击；原生RAF转发计数、不替换时钟或系统偏好。不是组件取消、OS或其他引擎验收。</p>
<script>window.__evidenceDiagnostics=[]; for(const name of ['warn','error']){const original=console[name];console[name]=(...args)=>{window.__evidenceDiagnostics.push({kind:name,text:args.map(String).join(' ')});original.apply(console,args)}}window.addEventListener('error',event=>window.__evidenceDiagnostics.push({kind:'error-event',text:String(event.message)}));window.addEventListener('unhandledrejection',event=>window.__evidenceDiagnostics.push({kind:'unhandledrejection',text:String(event.reason)}));</script><p id="status" role="status"></p><div id="buttons"></div><div id="targets"></div><ul id="summary"></ul><output aria-label="Scroll execution results"></output><script type="module" src="./scroll-execution-main.js"></script></html>
