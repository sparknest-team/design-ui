<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>InputNumber Countdown slow-frame diagnostic</title>
<style>body{margin:20px;font:14px system-ui}button{margin:4px;padding:8px}output{display:block;white-space:pre-wrap;max-height:280px;overflow:auto}#cases{display:flex;gap:12px}section{border:1px solid #aaa;padding:12px;min-width:320px}</style>
<script>window.__evidenceDiagnostics=[];for(const name of ['warn','error']){const original=console[name];console[name]=(...args)=>{window.__evidenceDiagnostics.push({kind:name,text:args.map(String).join(' ')});original.apply(console,args)}}window.addEventListener('error',event=>window.__evidenceDiagnostics.push({kind:'error-event',text:String(event.message)}));window.addEventListener('unhandledrejection',event=>window.__evidenceDiagnostics.push({kind:'unhandledrejection',text:String(event.reason)}));</script><div id="app"></div><script type="module" src="./business-lifecycle-slow-frame-diagnostic.js"></script></html>
