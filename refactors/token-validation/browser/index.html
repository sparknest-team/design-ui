<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>Token desktop acceptance</title>
  <style>
    #app {
      margin: 24px;
      font: 14px system-ui;
    }
    #app main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    #app section {
      padding: 20px;
      min-width: 0;
    }
    #app article {
      margin: 16px 0;
    }
    #app header {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    #app h2 {
      margin: 0 0 16px;
    }
    #app button,
    #app select {
      font: inherit;
    }
    #app label {
      display: block;
      margin-bottom: 8px;
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @media (max-width: 767px) {
      #app {
        margin: 12px;
      }
      #app main {
        grid-template-columns: minmax(0, 1fr);
      }
      #app header {
        flex-wrap: wrap;
      }
      #app section {
        padding: 16px;
      }
    }
  </style>
  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</html>
