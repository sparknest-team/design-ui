<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoadingBar native motion lifecycle acceptance</title>
  <style>
    body {
      margin: 28px;
      font: 16px system-ui;
    }
    button {
      padding: 12px;
      margin: 8px;
    }
    output {
      display: block;
      white-space: pre-wrap;
      font: 13px monospace;
    }
    body[data-timing='long'] {
      --mp-loading-bar-transition-duration: 600ms;
      --mp-loading-bar-transition-timing-function: linear;
    }
    body[data-timing='long'] .mp-loading-bar {
      transition-delay: 100ms, 200ms, 0ms;
    }
    body[data-timing='zero'] {
      --mp-loading-bar-transition-duration: 0ms;
    }
  </style>
  <div id="app"></div>
  <script type="module" src="./loading-bar-motion-main.js"></script>
</html>
