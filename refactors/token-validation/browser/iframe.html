<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real iframe portal acceptance</title>
  <style>
    body {
      margin: 16px;
      font: 14px system-ui;
    }
    button {
      font: inherit;
      margin: 4px;
    }
    .realms {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    iframe {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 480px;
      border: 2px solid #64748b;
    }
    #top-host {
      position: relative;
      height: 480px;
      overflow: auto;
      box-sizing: border-box;
      padding: 8px;
      border: 2px solid #64748b;
    }
    p {
      overflow-wrap: anywhere;
    }
  </style>
  <div id="app"></div>
  <script type="module" src="./iframe-main.js"></script>
</html>
