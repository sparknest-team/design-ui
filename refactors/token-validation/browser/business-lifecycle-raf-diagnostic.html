<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>InputNumber Countdown real lifecycle</title>
<style>body{margin:20px;font:14px system-ui}button{margin:4px;padding:8px}output{display:block;white-space:pre-wrap;max-height:280px;overflow:auto}#cases{display:flex;gap:12px}section{border:1px solid #aaa;padding:12px;min-width:320px}</style>
<script>window.__evidenceDiagnostics=[];for(const name of ['warn','error']){const original=console[name];console[name]=(...args)=>{window.__evidenceDiagnostics.push({kind:name,text:args.map(String).join(' ')});original.apply(console,args)}}window.addEventListener('error',event=>window.__evidenceDiagnostics.push({kind:'error-event',text:String(event.message)}));window.addEventListener('unhandledrejection',event=>window.__evidenceDiagnostics.push({kind:'unhandledrejection',text:String(event.reason)}));</script><script>window.__frameTrace=[];window.__clickTrace=[];const nativeRaf=window.requestAnimationFrame.bind(window),nativeCancel=window.cancelAnimationFrame.bind(window);window.requestAnimationFrame=function(callback){const requested=performance.now();let id;id=nativeRaf(timestamp=>{window.__frameTrace.push({type:'fire',id,time:performance.now(),timestamp,requested});callback(timestamp)});window.__frameTrace.push({type:'request',id,time:requested});return id};window.cancelAnimationFrame=function(id){window.__frameTrace.push({type:'cancel',id,time:performance.now()});return nativeCancel(id)};document.addEventListener('click',e=>{if(e.target instanceof HTMLButtonElement&&e.target.textContent.includes('countdown lifecycle'))window.__clickTrace.push({name:e.target.textContent,time:performance.now()})},true);</script><div id="app"></div><script type="module" src="./business-lifecycle-main.js"></script></html>
